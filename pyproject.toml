[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efactura-audit"
version = "0.2.0"
description = "Local anomaly audit for Romanian RO e-Factura supplier invoices, with a private AI assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gabriel Năstase" }]
license = { text = "Proprietary" }
# The engine (import, checks, SQL models) needs only these, so it also runs in a browser (Pyodide).
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lxml>=4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
reports = ["openpyxl>=3.1", "reportlab>=4.0", "matplotlib>=3.7"]
assistant = ["httpx>=0.25", "mcp>=1.2,<2"]
app = ["efactura-audit[reports,assistant]", "streamlit>=1.32", "plotly>=5.18"]
all = ["efactura-audit[app]"]
dev = ["pytest>=7", "rapidfuzz>=3.0"]

[project.scripts]
efactura-audit = "efactura_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
efactura_audit = [
    "assistant/ro_taskset.json",
    "config_default.toml",
    "transform/models/*.yml",
    "transform/models/*/*.sql",
    "transform/models/*/*.yml",
    "transform/data_tests/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
